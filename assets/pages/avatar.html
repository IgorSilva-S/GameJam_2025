<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coral Place - Avatar</title>
    <link rel="stylesheet" href="../css/avatarMaker.css">
    <link rel="shortcut icon" href="../img/icons/AvatarMaker.png" type="image/x-icon">
</head>

<body>
    <div class="avatarOpt start">
        <button>
            <div class="in">
                <img src="../img/buttonIcons/avatarMaker/fishIcon.png" alt="">

            </div>
        </button>
        <button>
            <div class="in">
                <img src="../img/buttonIcons/avatarMaker/hatIcon.png" alt="">
                Chapeu
            </div>
        </button>
        <button>
            <div class="in">
                <img src="../img/buttonIcons/avatarMaker/hairIcon.png" alt="">
                Algas
            </div>
        </button>
        <button>
            <div class="in">
                <img src="../img/buttonIcons/avatarMaker/eyeIcon.png" alt="">
                Olho
            </div>
        </button>
        <button>
            <div class="in">
                <img src="../img/buttonIcons/avatarMaker/barbtIcon.png" alt="">
                Barbatanas
            </div>
        </button>
        <button>
            <div class="in">Boca</div>
        </button>
        <button>
            <div class="in">Acessório facial</div>
        </button>
        <button>
            <div class="in">
                <img src="../img/buttonIcons/avatarMaker/colorIcon.png" alt="">
                Pele
            </div>
        </button>

        <input type="text" name="" id="" placeholder="Nome">

        <button class="end">
            <div class="in">Salvar e sair</div>
        </button>
    </div>
    <div class="avatarBar">
    </div>

</html>
