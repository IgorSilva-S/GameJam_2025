<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coral Place - Avatar</title>
    <link rel="stylesheet" href="../css/avatarMaker.css">
    <link rel="shortcut icon" href="../img/icons/AvatarMaker.png" type="image/x-icon">
</head>

<body>
    <video src="../img/bg/avatarMaker.mp4" muted autoplay loop></video>
    <div class="avatarOpt start">
        <button>
            <div class="in">
                <img src="../img/buttonIcons/avatarMaker/bodyIcon.png" alt="">
                Gênero
            </div>
        </button>
        <button>
            <div class="in">
                <img src="../img/buttonIcons/avatarMaker/hatIcon.png" alt="">
                Chapeu
            </div>
        </button>
        <button>
            <div class="in">
                <img src="../img/buttonIcons/avatarMaker/hairIcon.png" alt="">
                Algas
            </div>
        </button>
        <button>
            <div class="in">
                <img src="../img/buttonIcons/avatarMaker/eyeIcon.png" alt="">
                Olho
            </div>
        </button>
        <button>
            <div class="in">
                <img src="../img/buttonIcons/avatarMaker/barbtIcon.png" alt="">
                Barbatanas
            </div>
        </button>
        <button>
            <div class="in">
                <img src="../img/buttonIcons/avatarMaker/mouthIcon.png" alt="">
                Boca
            </div>
        </button>
        <button>
            <div class="in">
                <img src="../img/buttonIcons/avatarMaker/acessoryIcon.png" alt="">
                Acessório
            </div>
        </button>
        <button>
            <div class="in">
                <img src="../img/buttonIcons/avatarMaker/colorIcon.png" alt="">
                Cores
            </div>
        </button>

        <button class="end">
            <div class="in">Salvar e sair</div>
        </button>

    </div>
    <div class="avatarBar">
        <img src="../img/avatar/body/color0.png" alt="" id="bodyColor">
        <img src="../img/avatar/eye/eye0.png" alt="" id="avatarEye">
        <img src="../img/avatar/mouth/mouth0.png" alt="" id="avatarMouth">
        <img src="../img/avatar/protection.png" alt="">
    </div>
</body>

</html>
