<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coral Place - Avatar</title>
    <link rel="stylesheet" href="../css/avatarMaker.css">
    <link rel="stylesheet" href="../css/animatedBorder.css">
    <link rel="shortcut icon" href="../img/icons/AvatarMaker.png" type="image/x-icon">
</head>

<body>
    <!-- <video src="../img/bg/avatarMaker.mp4" muted autoplay loop></video> -->
    <div class="avatarOpt">
        <div class="optionsContainer">
            <button id="colorBtn">
                <img src="../img/buttonIcons/avatarMaker/colorIcon.png" alt="">
            </button>
            <button>
                <img src="../img/buttonIcons/avatarMaker/hatIcon.png" alt="">
            </button>
            <button>
                <img src="../img/buttonIcons/avatarMaker/hairIcon.png" alt="">
            </button>
            <button id="eyeBtn">
                <img src="../img/buttonIcons/avatarMaker/eyeIcon.png" alt="">
            </button>
            <button>
                <img src="../img/buttonIcons/avatarMaker/barbtIcon.png" alt="">
            </button>
            <button>
                <img src="../img/buttonIcons/avatarMaker/mouthIcon.png" alt="">
            </button>
            <button>
                <img src="../img/buttonIcons/avatarMaker/acessoryIcon.png" alt="">
            </button>
            <button>
                Salvar e sair
            </button>
        </div>
        <div class="subOptions" id="colorsOpt">
            <div class="animatedBorder opt" id="color1" edit="color">
                <div class="content" style="background-color: #5b6ee1;"></div>
            </div>
            <div class="animatedBorder opt" id="color2" edit="color">
                <div class="content"  style="background-color: #ac3232;"></div>
            </div>
            <div class="animatedBorder opt" id="color3" edit="color">
                <div class="content" style="background-color: #76428a;"></div>
            </div>
            <div class="animatedBorder opt" id="color4" edit="color">
                <div class="content" style="background-color: #37946e;"></div>
            </div>
            <div class="animatedBorder opt" id="color5" edit="color">
                <div class="content" style="background-color: #df7126;"></div>
            </div>
            <div class="animatedBorder opt" id="color6" edit="color">
                <div class="content" style="background-color: #eec39a;"></div>
            </div>
            <div class="animatedBorder opt" id="color7" edit="color">
                <div class="content" style="background-color: #663931;"></div>
            </div>
            <div class="animatedBorder opt" id="color8" edit="color">
                <div class="content" style="background-color: #d77bba;"></div>
            </div>
        </div>

        <div class="subOptions" id="eyesOpt" style="display: none;">
            <div class="animatedBorder opt" id="eye1">
                <div class="content"></div>
            </div>
            <div class="animatedBorder opt" id="eye2">
                <div class="content"></div>
            </div>
            <div class="animatedBorder opt" id="eye3">
                <div class="content"></div>
            </div>
            <div class="animatedBorder opt" id="eye4">
                <div class="content"></div>
            </div>
            <div class="animatedBorder opt" id="eye5">
                <div class="content"></div>
            </div>
            <div class="animatedBorder opt" id="eye6">
                <div class="content"></div>
            </div>
            <div class="animatedBorder opt" id="eye7">
                <div class="content"></div>
            </div>
            <div class="animatedBorder opt" id="eye8">
                <div class="content"></div>
            </div>
            <div class="animatedBorder opt" id="eye9">
                <div class="content"></div>
            </div>
            <div class="animatedBorder opt" id="eye10">
                <div class="content"></div>
            </div>
            <div class="animatedBorder opt" id="eye11">
                <div class="content"></div>
            </div>
            <div class="animatedBorder opt" id="eye12">
                <div class="content"></div>
            </div>
        </div>
    </div>
    <div class="avatarBar">
        <img src="../img/avatar/body/color0.png" alt="" id="bodyColor">
        <img src="../img/avatar/eye/eye0.png" alt="" id="avatarEye">
        <img src="../img/avatar/mouth/mouth0.png" alt="" id="avatarMouth">
        <img src="../img/avatar/protection.png" alt="">
    </div>

    <script src="../js/avatarMaker.js"></script>
</body>

</html>
