<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish's burguer</title>
    <link rel="stylesheet" href="../css/food.css">
    <link rel="shortcut icon" href="../img/icons/food/Fish burguer.png" type="image/x-icon">
</head>
<body>
    <!-- <div></div> -->
    <div id="titulo">
        <img src="../img/icons/food/Fish burguer.png">
        <h1>Fish's Burguer</h1>
        <button onclick="criarPrato()">Prato</button>
    </div>
    
    <div id="jogo">
        <div id="pedidos">
            <div class="pedido">
                <p>Pedido: <br></p>
                <!-- <div style="width: 130px; height: 100px; background-color: aquamarine;"></div> -->
                <img src="../img/icons/food/TV.png" id="pc">
                <img src="../img/icons/food/Turtle screen.png" id="order">
            </div>
            <div class="pedido">
                <p>Pedido: <br></p>
                <!-- <div style="width: 130px; height: 100px; background-color: aquamarine;"></div> -->
                <img src="../img/icons/food/TV.png" id="pc">
                <img src="../img/icons/food/Turtle screen.png" id="order">
            </div>
            <div class="pedido">
                <img src="../img/icons/food/prato.png">
                <img src="../img/icons/food/Pão quadrado.png">
                <img src="../img/icons/food/Peixe.png">
                <img src="../img/icons/food/Alga 1.png">
                <img src="../img/icons/food/Pão quadrado.png">
            </div>
        </div>
        
        <div id="esteira">
            <div id="ingredientes">
                <div id="pão">
                    <div id="pão-quadrado" onclick="colocarIngrediente('Pão quadrado', 1)">
                        <img src="../img/icons/food/Pão quadrado (2).png">
                    </div>
                    <div id="pão-redondo" onclick="colocarIngrediente('Pão redondo inferior', 1)">
                        <img src="../img/icons/food/Pão redondo inferior.png">
                        <img src="../img/icons/food/Pão redondo superior.png">
                    </div>
                    <div id="pão-triangular" onclick="colocarIngrediente('Pão triangular', 1)">
                        <img src="../img/icons/food/Pão triangular.png">
                    </div>
                </div>
                <div id="salada">
                    <div id="alga-marinha-1" onclick="colocarIngrediente('Alga 1', 2)">
                        <img src="../img/icons/food/Alga 1.png">
                    </div>
                    <div id="alga-marinha-2" onclick="colocarIngrediente('Alga 2', 2)">
                        <img src="../img/icons/food/Alga 1.png">
                    </div>
                    <div id="tomate" onclick="colocarIngrediente('Tomate', 2)">
                        <img src="../img/icons/food/Tomate.png" width="52px" height="26px" style="outline: none;">
                    </div>
                </div>
                <div id="carne">
                    <div id="peixe" onclick="colocarIngrediente('Peixe', 3)">
                        <img src="../img/icons/food/Peixe.png">
                    </div>
                    <div id="plâncton" onclick="colocarIngrediente('Plancton', 3)">
                        <img src="../img/icons/food/Alga 1.png">
                    </div>
                    <div id="camarão" onclick="colocarIngrediente('Camarao', 3)">
                        <img src="../img/icons/food/Camarao.png">
                    </div>
                </div>
            </div>
            <div id="montagem">
                <div id="espaços">
                    <div id="slot1">
                        
                    </div>
                    <div id="slot2">
                        
                    </div>
                    <div id="slot3">
                        
                    </div>
                    <div id="slot4">
                        
                    </div>
                    <div id="lixo">

                    </div>
                    <div id="entrega">

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/food.js"></script>
</body>
</html>
